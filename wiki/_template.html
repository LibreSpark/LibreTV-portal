<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - LibreTV 文档</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="author" content="LibreTV Team">
    <link rel="canonical" href="{{CANONICAL}}">

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:title" content="{{TITLE}} - LibreTV 文档">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{TITLE}} - LibreTV 文档">
    <meta name="twitter:description" content="{{DESCRIPTION}}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/logo-black.png">
    <link rel="apple-touch-icon" href="../assets/logo-black.png">

    <link rel="stylesheet" href="../styles/wiki.css">
    <script>document.documentElement.classList.add('js');</script>
</head>
<body class="wiki-page">
    <a class="skip-link" href="#wiki-main">跳到主要内容</a>

    {{PARTICLES}}

    <!-- Navigation -->
    <nav class="navbar" aria-label="文档导航">
        <div class="nav-container">
            <a class="nav-logo" href="../index.html" aria-label="返回 LibreTV 首页">
                <img src="../assets/logo-black.png" alt="LibreTV Logo" class="logo-img">
                <span class="logo-text">LibreTV</span>
            </a>
            <div class="nav-menu" id="nav-menu">
                <a href="../index.html" class="nav-link">首页</a>
                <a href="index.html" class="nav-link active">文档</a>
                <a href="https://github.com/LibreSpark/LibreTV" class="nav-link github-link" target="_blank" rel="noopener noreferrer">
                    <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 0C5.374 0 0 5.373 0 12 0 17.302 3.438 21.8 8.207 23.387c.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span>GitHub</span>
                </a>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="切换菜单" aria-expanded="false" aria-controls="nav-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </nav>

    <main id="wiki-main" class="wiki-main">
        <div class="wiki-container">
            <!-- Sidebar -->
            <aside class="wiki-sidebar" id="wiki-sidebar" aria-label="文档目录">
                <div class="wiki-sidebar-close"><button type="button" id="sidebarClose" aria-label="关闭文档目录">✕</button></div>
                <div class="wiki-sidebar-inner">
                    <div class="wiki-sidebar-title">📖 文档</div>
                    <nav class="wiki-nav">
                        <ul>
{{SIDEBAR}}
                        </ul>
                    </nav>
                    <div class="wiki-sidebar-meta">
                        <a href="https://github.com/LibreSpark/LibreTV/wiki/{{PAGE_NAME}}" target="_blank" rel="noopener noreferrer">在 GitHub 上编辑此页 ↗</a>
                    </div>
                </div>
            </aside>
            <div class="wiki-sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
            <button class="wiki-sidebar-toggle" id="sidebarToggle" type="button" aria-controls="wiki-sidebar" aria-expanded="false">☰ 文档目录</button>

            <!-- Content -->
            <article class="wiki-content">
                <div class="wiki-breadcrumb">
                    <a href="index.html">文档</a><span aria-hidden="true">/</span><span>{{TITLE}}</span>
                </div>
                <h1 class="wiki-title gradient-text">{{TITLE}}</h1>
                <div class="wiki-body markdown-body">
{{CONTENT}}
                </div>
                <nav class="wiki-pager" aria-label="上一篇 / 下一篇">
{{PREV_NEXT}}
                </nav>
            </article>

            <!-- Page TOC -->
            <aside class="wiki-toc" aria-label="本页目录">
                <div class="wiki-toc-title">本页目录</div>
                {{TOC}}
            </aside>
        </div>
    </main>

    <footer class="wiki-footer">
        <div class="wiki-container" style="display:block;">
            <div>
                <a href="../index.html">LibreTV 门户首页</a> ·
                <a href="https://github.com/LibreSpark/LibreTV" target="_blank" rel="noopener noreferrer">GitHub 仓库</a> ·
                <a href="https://github.com/LibreSpark/LibreTV/wiki" target="_blank" rel="noopener noreferrer">Wiki 源</a>
            </div>
            <div class="footer-copyright">&copy; <span id="currentYear"></span> LibreTV · 基于 AGPL-3.0 许可证开源 · 文档内容同步自主仓库 Wiki</div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="回到顶部">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M18 15l-6-6-6 6"/>
        </svg>
    </button>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../scripts/wiki.js" defer></script>
</body>
</html>
